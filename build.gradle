plugins {
    id 'java'
    id 'application'
}

group = 'eleeter.elcanvas'
version = '1.0-SNAPSHOT'


/* Detect OS for natives */
project.ext.lwjglVersion = "3.4.1"
project.ext.jomlVersion = "1.10.8"
project.ext.platform = org.gradle.internal.os.OperatingSystem.current().isWindows() ? "windows" : org.gradle.internal.os.OperatingSystem.current().isMacOsX() ? "macos" : "linux"

configurations {
    shade
    implementation.extendsFrom shade
}
repositories {
    mavenCentral()
    flatDir { dirs 'libs' }
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation platform("org.lwjgl:lwjgl-bom:${project.ext.lwjglVersion}")
    implementation "org.lwjgl:lwjgl"
    implementation "org.lwjgl:lwjgl-opengl"
    implementation "com.google.code.gson:gson:2.10.1"
    implementation "org.joml:joml:${project.ext.jomlVersion}"


    runtimeOnly "org.lwjgl:lwjgl::natives-${project.ext.platform}"
    runtimeOnly "org.lwjgl:lwjgl-opengl::natives-${project.ext.platform}"
}

test {
    useJUnitPlatform()
}
